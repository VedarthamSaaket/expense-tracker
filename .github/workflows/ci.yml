name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: flake8

      - name: Run pytest
        run: pytest -v

  api-test:
    name: Postman API tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start the api
        run: |
          DATABASE_PATH=/tmp/ci.db gunicorn -b 0.0.0.0:5000 run:app --daemon
          for i in $(seq 1 20); do
            curl -sf http://localhost:5000/health && break
            sleep 1
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run newman
        run: |
          npx -y newman@6.2.1 run postman/expense-tracker.postman_collection.json \
            -e postman/local.postman_environment.json \
            --reporters cli,junit --reporter-junit-export newman-report.xml

      - name: Upload newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report.xml

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: api-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Package the app
        run: zip -r expense-tracker.zip app run.py requirements.txt

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-${{ github.sha }}
          path: expense-tracker.zip

      - name: Trigger render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        if: env.RENDER_DEPLOY_HOOK != ''
        run: curl -sf -X POST "$RENDER_DEPLOY_HOOK"

      - name: Smoke test the live api
        env:
          APP_URL: ${{ vars.APP_URL }}
        if: env.APP_URL != ''
        run: |
          for i in $(seq 1 30); do
            curl -sf "$APP_URL/health" && exit 0
            sleep 10
          done
          exit 1
